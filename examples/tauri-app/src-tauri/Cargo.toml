[package]
name = "vnidrop-share-example"
version = "0.1.0"
description = "Vnidrop Share plugin example"
authors = ["Vnidrop"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "tauri_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.4.1", default-features = false, features = [] }

[dependencies]
tauri = { version = "2.8.5", features = [] }
tauri-plugin-vnidrop-share = { path = "../../../" }
